name: Community source and standalone image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public source privacy
        run: python scripts/community_privacy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Build and load isolated CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: growthlog-community:local
          cache-from: type=gha,scope=community
          cache-to: type=gha,mode=max,scope=community
      - name: Configure independent instance
        run: |
          python scripts/setup_env.py
          docker compose up -d --wait db
          docker compose run --rm app python -m scripts.community_init init
          docker compose run --rm app python -m scripts.community_admin_smoke
          if docker compose run --rm app python -m scripts.community_init init; then
            echo "Nonempty database was not rejected"
            exit 1
          fi
      - name: Image privacy and CPU validation
        run: |
          docker run --rm growthlog-community:local python scripts/community_privacy.py --image
          docker run --rm growthlog-community:local python -c "import torch; from importlib import metadata; assert torch.version.cuda is None; names={d.metadata['Name'].lower() for d in metadata.distributions()}; assert not any(n.startswith('nvidia-') or 'triton' in n for n in names); print('CPU_ONLY_OK')"
      - name: Prepare and verify E5
        run: docker compose run --rm prepare-model
      - name: Start application and both workers
        run: |
          docker compose up -d --wait app worker notification-worker
          curl --fail --silent http://127.0.0.1:8000/api/health
      - name: Real HTTP and synthetic cleanup
        run: docker compose exec -T -e COMMUNITY_SMOKE=1 app python -m scripts.community_http_smoke
      - name: Focused AI and source contracts
        run: |
          docker run --rm --network "container:$(docker compose ps -q db)" --env-file .env -e RAG_EMBEDDING_ALLOW_DOWNLOAD=false --volume "$PWD:/workspace:ro" --volume "$(which node):/usr/local/bin/node:ro" --entrypoint bash growthlog-community:local /workspace/scripts/community_contracts.sh
      - name: Final process health
        run: |
          docker compose ps
          curl --fail --silent http://127.0.0.1:8000/api/health
      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --tail=45 app worker notification-worker
      - name: Remove this runner's test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
